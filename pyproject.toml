[project]
name = "ai-music-detector"
version = "0.0.0"
description = "Calibrated AI-generated music detection: bench harness and library"
requires-python = ">=3.10,<3.11"
dependencies = [
  # numpy: float32 audio windows and all shared DSP/window math (CC §7).
  "numpy>=1.26,<2",
  # onnxruntime: runs the approved fakeprint ONNX model on CPU in Phase 1 (CC §7).
  "onnxruntime>=1.23,<1.24",
  # torch/torchaudio: sonics SpecTTTra inference; pinned to the verified 2.6.0 build (CC §7).
  "torch==2.6.0",
  "torchaudio==2.6.0",
  # huggingface_hub: fetches pinned SpecTTTra snapshots; sonics imports it but omits it from setup.py.
  "huggingface_hub>=0.28,<1",
  # sonics: HFAudioClassifier for the Phase 2 SpecTTTra backends (approved in the plan).
  "sonics @ git+https://github.com/awsaf49/sonics.git@9156ffad151f797c71556923c4a02fa01fa8fc91",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.uv]
# Phase 0 is a bench skeleton; the library package is added in Phase 6.
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["benches", "aidetect"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["benches"]

[tool.pytest.ini_options]
testpaths = ["benches/tests", "scripts/tests"]
addopts = "-m 'not integration and not slow and not gpu'"
markers = [
  "integration: requires external model weights, network or other unavailable services",
  "slow: long-running test, excluded from the default run",
  "gpu: requires a CUDA GPU, excluded from the default run",
]
